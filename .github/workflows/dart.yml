# CI for Quran Tasmee3.
#
# Two jobs:
#  - core: the pure-Dart engine (packages/quran_tasmee3_core) — plain `dart`,
#    no Flutter needed. This is the source of truth and must always be green.
#  - app:  the Flutter app — `flutter analyze` + `flutter test`. Runs with the
#    Flutter SDK (the repo root is a Flutter app, so plain `dart pub get` here
#    fails — that was the previous CI bug).
#
# Third-party actions (subosito/flutter-action) are governed by their own terms.

name: CI

on:
  push:
    branches: [ "claude/peaceful-cannon-ktbz8d", "main" ]
  pull_request:
    branches: [ "claude/peaceful-cannon-ktbz8d", "main" ]

jobs:
  core:
    name: Pure-Dart core (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/quran_tasmee3_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603
      - name: Install dependencies
        run: dart pub get
      - name: Analyze
        run: dart analyze
      - name: Test
        run: dart test

  app:
    name: Flutter app (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
