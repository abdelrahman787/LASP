name: quran_tasmee3
description: >-
  Quran Tasmee3 — offline-first Quran memorization app. This is the Flutter
  app shell wiring the pure-Dart cores (in packages/quran_tasmee3_core) into
  Riverpod providers. It currently runs entirely on FAKE implementations of the
  three external dependencies (ASR, Quran data, Firestore) so it compiles and
  runs with no credentials. Each fake is swapped for a real implementation via
  a single line in lib/app/providers.dart — see the "SWAP POINT" markers.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  quran_tasmee3_core:
    path: packages/quran_tasmee3_core

  # --- Added only when swapping in REAL implementations: ---
  firebase_core: ^3.6.0            # SWAP 2: Firebase
  firebase_auth: ^5.3.1            # SWAP 2: Firebase
  cloud_firestore: ^5.4.4          # SWAP 2: Firebase
  dio: ^5.7.0                      # SWAP 1: real ASR (Worker upload)
  record: ^7.1.0                   # SWAP 1: real ASR (mic capture)
  permission_handler: ^11.3.1      # SWAP 1: real ASR (mic permission)
  sqflite: ^2.3.3                  # SWAP 3: bundled Quran SQLite
  path_provider: ^2.1.4            # SWAP 3: copy bundled DB to a writable path
  # sherpa_onnx removed: its libonnxruntime.so conflicted with onnxruntime package;
  # Silero VAD replaced by pure-Dart energy VAD (no native libs needed for VAD).
  onnxruntime: ^1.2.0              # Direct ONNX inference with cache for streaming CTC.
  # flutter_local_notifications: ^17.2.3  # Review Plans Phase 6 reminders

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Built locally by tools/seed (gitignored except .gitkeep). The app falls
    # back to FakeQuranRepository if these aren't present.
    - assets/quran/
    - assets/quran/fonts/
    # Offline CTC model (Gate-1 verified; gitignored except .gitkeep).
    - assets/models/tarteel/
    # Streaming Transducer model — Muno459/fastconformer-quran-streaming
    # (encoder.onnx, decoder.onnx, joiner.onnx, tokens.txt; gitignored except
    # .gitkeep). App falls back to SherpaOnnxAsrService if absent.
    - assets/models/streaming/
    # Gate-1 / Gate-0 verification clip (16 kHz mono PCM16). Gitignored except
    # .gitkeep — drop your verified ayah16k.wav here to run lib/dev/gate1_main.dart.
    - assets/test_audio/
    # Self-authored decorative surah-name frame (tools/art/make_surah_banner.py).
    # Committed (not gitignored) — one shared asset reused for all surahs.
    - assets/decor/
  fonts:
    # Bundled locally (offline-first) — no runtime font fetch.
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # KFGQPC Uthman Taha Naskh (King Fahd Complex, same source as the QCF page
    # fonts) — authentic mushaf Naskh for surah names, ayah counts, and Basmala.
    - family: KFGQPC Uthman Taha Naskh
      fonts:
        - asset: assets/fonts/UthmanTahaNaskh-Regular.ttf
        - asset: assets/fonts/UthmanTahaNaskh-Bold.ttf
          weight: 700
