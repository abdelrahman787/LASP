name: quran_tasmee3_core
description: >-
  Pure-Dart cores for the Quran Tasmee3 memorization app: the recitation
  matching engine (Feature 2/3) and the review-plan spaced-repetition
  scheduler (Feature 4). No Flutter or platform dependencies — these files
  are consumed unchanged by the Flutter app and are fully unit-tested here.
publish_to: none
# Pinned for the rebuild (Blueprint Phase 0): the core is frozen and consumed by
# the new app as a path dependency. Bump only with a measured, test-backed change.
version: 0.9.0

environment:
  sdk: ^3.5.0

dev_dependencies:
  test: ^1.25.0
