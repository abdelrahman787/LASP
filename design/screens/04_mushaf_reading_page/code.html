<script>
        // Auto-hide header/footer logic
        const header = document.getElementById('main-header');
        const footer = document.getElementById('main-footer');
        const scrollContainer = document.getElementById('scroll-container');
        let lastScrollTop = 0;

        scrollContainer.addEventListener('scroll', () => {
            const currentScrollTop = scrollContainer.scrollTop;
            
            // At the very top, always show
            if (currentScrollTop <= 0) {
                header.classList.remove('header-hidden');
                footer.classList.remove('footer-hidden');
                return;
            }

            // Detect scroll direction
            if (currentScrollTop > lastScrollTop) {
                // Scrolling down - Hide
                header.classList.add('header-hidden');
                footer.classList.add('footer-hidden');
            } else {
                // Scrolling up - Show
                header.classList.remove('header-hidden');
                footer.classList.remove('footer-hidden');
            }
            lastScrollTop = currentScrollTop;
        });

        // Micro-interaction for the Tasmee3 button pulse
        document.querySelector('.fixed.bottom-24').addEventListener('click', function() {
            const btn = this;
            const icon = btn.querySelector('.material-symbols-outlined');
            
            if(btn.dataset.recording === 'true') {
                btn.dataset.recording = 'false';
                btn.classList.remove('ring-4', 'ring-primary/30');
                icon.innerText = 'mic';
                btn.style.backgroundColor = '';
            } else {
                btn.dataset.recording = 'true';
                btn.classList.add('ring-4', 'ring-primary/30');
                icon.innerText = 'graphic_eq';
                btn.style.backgroundColor = '#ba1a1a'; // Visual change to signify recording
            }
        });

        // Simple parallax effect for the page background
        window.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 50;
            const moveY = (e.clientY - window.innerHeight / 2) / 50;
            document.querySelector('.mushaf-page').style.backgroundPosition = `calc(50% + ${moveX}px) calc(50% + ${moveY}px)`;
        });
    </script>
