<style>
        body {
            background: linear-gradient(135deg, #e0eafc 0%, #ffffff 100%);
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
        }

        .liquid-glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(0, 43, 102, 0.05);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.6);
            border-color: #194185;
            box-shadow: 0 0 0 4px rgba(25, 65, 133, 0.1);
            outline: none;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        .floating-shape {
            position: absolute;
            z-index: -1;
            filter: blur(80px);
            border-radius: 50%;
            opacity: 0.6;
            animation: drift 20s infinite alternate ease-in-out;
        }

        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(100px, 50px) scale(1.1); }
        }

        .btn-hover-effect:active {
            transform: scale(0.98);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="flex items-center justify-center p-container-padding relative">
<!-- Background Orbs -->
<div class="floating-shape bg-primary-fixed-dim w-[400px] h-[400px] top-[-10%] right-[-10%]"></div>
<div class="floating-shape bg-secondary-container w-[300px] h-[300px] bottom-[-5%] left-[-5%]" style="animation-delay: -5s;"></div>
<main class="w-full max-w-[420px] z-10">
<!-- Login Card -->
<div class="liquid-glass rounded-3xl p-8 md:p-10 flex flex-col items-center">
<!-- Branding -->
<div class="mb-8 text-center">
<div class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center mb-4 mx-auto shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-on-primary-container text-4xl" style="font-variation-settings: 'FILL' 1;">menu_book</span>
</div>
<h1 class="font-display-ar text-display-ar text-primary">قرآن تسميع</h1>
<p class="font-body-ar-md text-body-ar-md text-on-surface-variant mt-1 opacity-80">رفيقك في رحلة الحفظ</p>
</div>
<!-- Header -->
<div class="w-full mb-8">
<h2 class="font-headline-ar text-headline-ar text-on-surface text-right">تسجيل الدخول</h2>
<p class="font-body-ar-md text-body-ar-md text-on-surface-variant text-right mt-1">أهلاً بك مجدداً، تابع تقدمك في الحفظ</p>
</div>
<!-- Form -->
<form class="w-full space-y-element-gap" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label-ar-sm text-label-ar-sm text-on-surface-variant mr-1">البريد الإلكتروني</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60">mail</span>
<input class="glass-input w-full h-14 pr-12 pl-4 rounded-xl font-body-ar-md text-on-surface placeholder:text-on-surface-variant/40" placeholder="example@mail.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block font-label-ar-sm text-label-ar-sm text-on-surface-variant mr-1">كلمة المرور</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60">lock</span>
<input class="glass-input w-full h-14 pr-12 pl-12 rounded-xl font-body-ar-md text-on-surface placeholder:text-on-surface-variant/40 border-error/30" placeholder="••••••••" type="password"/>
<button class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<!-- Error State Example -->
<p class="font-label-ar-sm text-label-ar-sm text-error/80 mr-1 flex items-center gap-1">
<span class="material-symbols-outlined text-sm">error</span>
                        كلمة المرور غير صحيحة، يرجى المحاولة مرة أخرى
                    </p>
</div>
<!-- Forgot Password -->
<div class="flex justify-end">
<a class="font-label-ar-sm text-label-ar-sm text-secondary hover:text-primary transition-colors" href="#">نسيت كلمة المرور؟</a>
</div>
<!-- Submit Button -->
<button class="btn-hover-effect w-full h-14 bg-[#194185] hover:bg-primary text-white rounded-xl font-title-ar text-title-ar shadow-xl shadow-primary/10 transition-all duration-300 mt-4 flex items-center justify-center gap-2" type="submit">
<span>دخول</span>
<span class="material-symbols-outlined rotate-180">arrow_forward</span>
</button>
</form>
<!-- Social/Secondary -->
<div class="w-full mt-8 pt-8 border-t border-white/20">
<div class="text-center space-y-4">
<p class="font-body-ar-md text-body-ar-md text-on-surface-variant">
                        ليس لديك حساب؟

</p>
<div class="flex items-center gap-4 py-2">
<div class="h-[1px] flex-1 bg-white/30"></div>
<span class="font-label-ar-sm text-label-ar-sm text-on-surface-variant/60">أو عبر</span>
<div class="h-[1px] flex-1 bg-white/30"></div>

</button>
<button class="glass-input p-3 rounded-full hover:bg-white/50 transition-all">
<span class="material-symbols-outlined text-on-surface-variant">apps</span>
</button>
</div>
</div>
</div>
</div>
<!-- Footer Help -->
<p class="text-center mt-8 font-label-ar-sm text-label-ar-sm text-on-surface-variant/60">
            باستمرارك، أنت توافق على <a class="underline" href="#">شروط الخدمة</a> و <a class="underline" href="#">سياسة الخصوصية</a>
</p>
</main>
<script>
        // Simple micro-interaction for password visibility toggle
        const toggleBtn = document.querySelector('button[type="button"]');
        const passwordInput = document.querySelector('input[type="password"]');
        
        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                toggleBtn.children[0].innerText = isPassword ? 'visibility_off' : 'visibility';
            });
        }

        // Form submission animation mock
        const loginBtn = document.querySelector('button[type="submit"]');
        loginBtn.addEventListener('click', (e) => {
            const originalContent = loginBtn.innerHTML;
            loginBtn.innerHTML = `<span class="inline-block w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>`;
            loginBtn.classList.add('opacity-80', 'pointer-events-none');
            
            setTimeout(() => {
                loginBtn.innerHTML = originalContent;
                loginBtn.classList.remove('opacity-80', 'pointer-events-none');
            }, 1500);
        });
    </script>
</body></html>
