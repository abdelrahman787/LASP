name: quran_tasmee3
description: >-
  Quran Tasmee3 — offline-first Quran memorization app (rebuild). Clean Flutter
  shell over the unchanged pure-Dart core (packages/quran_tasmee3_core), wired
  via Riverpod swap points. Infra + ASR are rebuilt from scratch; the mushaf /
  report / plans screens are migrated from the legacy app with rendering logic
  preserved (see docs/REBUILD_BLUEPRINT.md, hybrid approach).
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1

  # The frozen engine (Phase 0). Path dep — never edited to fit the app.
  quran_tasmee3_core:
    path: ../packages/quran_tasmee3_core

  # --- Added per blueprint phase as each subsystem lands: ---
  # Phase 2 (on-device streaming ASR):
  #   record: ^7.1.0
  #   sherpa_onnx: ^1.10.30          # resolves to 1.13.3 (NeMo-CTC)
  #   permission_handler: ^11.3.1
  # Phase 3 (mushaf data):
  #   sqflite: ^2.3.3
  #   path_provider: ^2.1.4
  # Phase 4 (cloud):
  #   firebase_core: ^3.6.0
  #   firebase_auth: ^5.3.1
  #   cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true   # build l10n from lib/l10n/*.arb

  # Assets are migrated per phase (mushaf fonts/db Phase 3, ASR model Phase 2).
  # assets:
  #   - assets/quran/
  #   - assets/quran/fonts/
  #   - assets/models/tarteel/
  #   - assets/test_audio/
  #   - assets/decor/
  #
  # fonts:  (migrated with the mushaf screen — IBM Plex Sans Arabic + KFGQPC)
